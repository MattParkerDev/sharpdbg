name: Publish NuGet Package
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  determine-if-publish-necessary:
    runs-on: ubuntu-latest
    outputs:
      publish-necessary: ${{ steps.determine-if-publish-necessary.outputs.publish-necessary }}
      tool-publish-necessary: ${{ steps.determine-if-publish-necessary.outputs.tool-publish-necessary }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
      - name: dotnet run DetermineIfPublishNecessary
        id: determine-if-publish-necessary
        shell: bash
        run: |
          dotnet run --project ./iac/DetermineIfPublishNecessary/DetermineIfPublishNecessary.csproj
      - name: Debug Output
        run: |
          echo Publish necessary: ${{ steps.determine-if-publish-necessary.outputs.publish-necessary }}
          echo Tool Publish necessary: ${{ steps.determine-if-publish-necessary.outputs.tool-publish-necessary }}
  nuget-approval:
    runs-on: ubuntu-latest
    environment: "nuget-publish-approval"
    permissions:
      contents: read
      id-token: write # enable GitHub OIDC token issuance for NuGet trusted publishing
    needs: determine-if-publish-necessary
    if: needs.determine-if-publish-necessary.outputs.publish-necessary == 'true' || needs.determine-if-publish-necessary.outputs.tool-publish-necessary == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: MattParkerDev
      - name: Publish to NuGet
        if: needs.determine-if-publish-necessary.outputs.publish-necessary == 'true'
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet run --project ./iac/PublishToNuget/PublishToNuget.csproj

      - name: Publish Tool to NuGet
        if: needs.determine-if-publish-necessary.outputs.tool-publish-necessary == 'true'
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet ./iac/publish-tool-to-nuget.cs

